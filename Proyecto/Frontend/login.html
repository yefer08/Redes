<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCore | Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="bg-grid"></div><div class="glow glow-one"></div><div class="glow glow-two"></div>
    <main class="login-layout">
        <section class="login-intro"><a class="login-brand" href="index.html"><span class="brand-mark">N</span><span><strong>NetCore</strong><small>DNS • DHCP • Firewall</small></span></a><span class="eyebrow">Acceso protegido</span><h1>Tu red, clara desde el primer acceso.</h1><p>Ingresa al centro de operaciones para revisar el estado de tu infraestructura.</p></section>
        <section class="login-card" aria-labelledby="loginTitle"><div class="card-head"><span class="eyebrow small">Panel privado</span><h2 id="loginTitle">Iniciar sesión</h2><p>Usa tus credenciales para continuar.</p></div>
            <form id="loginForm" novalidate><div class="login-field"><label for="username">Usuario</label><input id="username" name="username" type="text" autocomplete="username" required minlength="3" placeholder="Tu usuario"><small class="field-error" id="usernameError"></small></div><div class="login-field"><label for="password">Contraseña</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Tu contraseña"><button type="button" id="togglePassword" class="password-toggle" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button></div><small class="field-error" id="passwordError"></small></div><p class="login-error" id="loginError" role="alert" aria-live="polite"></p><button type="submit" id="loginButton" class="primary-btn login-submit"><span class="button-label">Ingresar</span><span class="button-loading" aria-hidden="true">Validando...</span></button></form>
            <a class="back-link" href="index.html">← Volver al inicio</a>
        </section>
    </main>
    <script src="login.js"></script>
</body>
</html>
